{% extends "base.html" %}

{% block title %}Baja confirmada{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-50 via-white to-nature-50 px-6">

  <div class="max-w-xl w-full bg-white rounded-[2.5rem] shadow-2xl p-12 text-center relative overflow-hidden">
    
    <!-- Decoración suave -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-nature-100 rounded-full blur-3xl opacity-40"></div>

    <!-- Icono -->
    <div class="mx-auto mb-6 flex items-center justify-center w-16 h-16 rounded-full bg-nature-100">
      <svg class="w-8 h-8 text-nature-600" fill="none" stroke="currentColor" stroke-width="2" 
           stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>

    <h1 class="font-serif text-3xl font-bold text-brand-900 mb-4">
      Baja confirmada
    </h1>

    <p class="text-gray-600 leading-relaxed font-light mb-6">
      El correo <span class="font-semibold text-brand-700">{{ email }}</span>
      ha sido eliminado correctamente del newsletter.
    </p>

    <p class="text-gray-500 text-sm mb-8">
      Lamentamos verte ir. Si en algún momento deseas volver, siempre serás bienvenido.
    </p>

    <a href="{% url 'home' %}" 
       class="inline-flex items-center justify-center rounded-full bg-brand-500 px-8 py-3 text-white font-bold shadow-lg hover:bg-brand-600 transition-transform hover:-translate-y-1">
        Volver al inicio
    </a>

  </div>

</section>
{% endblock %}
